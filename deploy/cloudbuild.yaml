# Cloud Build: build the API image once, deploy API + worker to Cloud Run.
# Run: gcloud builds submit --config deploy/cloudbuild.yaml \
#        --substitutions=_REGION=us-central1
# Secrets (DATABASE_URL, OPENAI_API_KEY) should come from Secret Manager in real use;
# shown here as build substitutions for clarity.

substitutions:
  _REGION: us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/looseends-api:$SHORT_SHA", "./api"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/looseends-api:$SHORT_SHA"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - looseends-api
      - --image=gcr.io/$PROJECT_ID/looseends-api:$SHORT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:looseends-db
      - --command=sh
      - --args=-c,alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $$PORT

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - looseends-worker
      - --image=gcr.io/$PROJECT_ID/looseends-api:$SHORT_SHA
      - --region=${_REGION}
      - --no-cpu-throttling
      - --min-instances=1
      - --max-instances=1
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:looseends-db
      - --command=python
      - --args=-m,app.worker

images:
  - gcr.io/$PROJECT_ID/looseends-api:$SHORT_SHA
